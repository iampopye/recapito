name: CI

on:
  pull_request:
  push:
    branches: [main]

# Default to no permissions at all; each job grants back only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep this in step with the root package.json "engines" field.
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Warms the pnpm store cache once so the parallel jobs below all hit it
  # instead of each resolving the dependency graph from the registry.
  # ---------------------------------------------------------------------------
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm lint` builds packages/shared first: the type-aware ESLint rules
      # need the shared package's emitted .d.ts files to resolve.
      - name: ESLint
        run: pnpm run lint

      # NON-BLOCKING FOR NOW. Prettier has never been run over this repo, so
      # ~56 pre-existing files are unformatted. Making this a hard gate today
      # would mean either red CI on every PR or a repo-wide reformat commit
      # tangled up with in-flight feature work.
      #
      # TO MAKE THIS BLOCKING: run `pnpm format` once, land it as its own
      # commit that touches nothing else, add that commit to
      # .git-blame-ignore-revs, then delete the `continue-on-error` line below.
      - name: Prettier (advisory)
        continue-on-error: true
        run: pnpm run format:check

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit (all workspaces)
        run: pnpm run typecheck

  # ---------------------------------------------------------------------------
  # No Postgres service container here on purpose. Every suite mocks its
  # TypeORM repository via @nestjs/testing, so nothing touches a database. If
  # that ever stops being true, add a separate `test-e2e` job with its own
  # services block rather than slowing this one down for everybody.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Jest (backend + shared)
        run: pnpm run test:cov

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/backend/coverage/
            packages/shared/coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build (${{ matrix.app }})
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend, imap-daemon]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # All three apps import the shared package via its built output.
      - name: Build shared package
        run: pnpm run build:shared

      - name: Build ${{ matrix.app }}
        run: pnpm run build:${{ matrix.app }}

  # A single required-status target, so branch protection needs one entry
  # rather than being updated every time the matrix changes.
  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${NEEDS_RESULT}" != "success" ]; then
            echo "One or more upstream CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs succeeded."
        env:
          NEEDS_RESULT: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && 'success' || 'failure' }}
